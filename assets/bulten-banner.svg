<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Bülten Studio</title>
  <desc id="desc">Haber tasarımları ve kısa videolar için yaratıcı çalışma alanı.</desc>
  <defs>
